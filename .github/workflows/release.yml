name: Portable release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release --extra gui
      - run: uv run --locked --extra gui python -m unittest discover -s tests -v
      - name: Build portable ZIP
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $buildArgs = @("--arch", $env:BUILD_ARCH)
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $buildArgs += @("--tag", $env:GITHUB_REF_NAME)
          }
          uv run --locked --group release --extra gui python tools\build_portable.py @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "Portable build failed" }
      - name: Smoke-test the extracted executable without Python
        shell: pwsh
        run: |
          $zip = Get-Item dist\*.zip
          $portable = Join-Path $env:RUNNER_TEMP "portable app"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $portable
          $exe = (Get-ChildItem $portable -Filter gputaskman.exe -Recurse).FullName
          $env:PYTHONPATH = ""
          $env:PYTHONHOME = ""
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location $portable
          try {
            & $exe --help
            if ($LASTEXITCODE -ne 0) { throw "Frozen executable smoke test failed" }
            $gui = Join-Path (Split-Path $exe) "gtm-gui.exe"
            $proc = Start-Process -FilePath $gui -ArgumentList "--help" -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Frozen GUI smoke test failed" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-portable
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }}
    # Built on the oldest supported Ubuntu: the frozen binary needs the build machine's glibc (2.35) or newer.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv sync --locked --group release
      - run: uv run --locked python -m unittest discover -s tests -v
      - name: Build portable tarball
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          args=(--arch "$BUILD_ARCH")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          uv run --locked --group release python tools/build_portable.py "${args[@]}"
      - name: Smoke-test the extracted executable without Python
        run: |
          portable="$RUNNER_TEMP/portable app"
          mkdir -p "$portable"
          tar -xzf dist/*.tar.gz -C "$portable"
          exe="$(find "$portable" -name gputaskman -type f -perm -u+x)"
          cd "$portable"
          env -i HOME="$HOME" PATH=/usr/bin:/bin "$exe" --help
          if find "$portable" -name 'libnvidia-ml*' -o -name 'libcuda*' | grep -q .; then
            echo "NVIDIA driver libraries must not be bundled" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-portable
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  build-python:
    name: Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.13"
      - run: uv lock --check
      - run: uv build --out-dir python-dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            python-dist/*.whl
            python-dist/*.tar.gz
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-linux, build-python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gputaskman/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish wheel and source distribution
        uses: pypa/gh-action-pypi-publish@release/v1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-portable"
          merge-multiple: true
          path: release-assets
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --generate-notes --title "GPU Task Manager $RELEASE_TAG"
