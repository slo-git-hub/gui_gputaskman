[project]
name = "gputaskman"
version = "0.3.3"
description = "An htop for what's inside your GPU: per-process VRAM, engine load, and LLM weights / KV cache breakdown"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Scott Hanselman" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "textual>=8.2.8",
]

[project.optional-dependencies]
gui = [
    "PySide6-Essentials>=6.8",
]

[project.scripts]
gputaskman = "gputaskman.cli:main"
gtm = "gputaskman.cli:main"

[project.gui-scripts]
gtm-gui = "gputaskman.gui:main"

[project.urls]
Repository = "https://github.com/shanselman/gputaskman"
Issues = "https://github.com/shanselman/gputaskman/issues"

[dependency-groups]
release = ["pyinstaller==6.22.3"]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
